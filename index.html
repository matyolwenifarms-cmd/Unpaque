<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unpaque — communication diagnostics</title>
    <meta
      name="description"
      content="Unpaque names the rhetorical structure of a piece of communication: what it is doing, where it puts responsibility, what it leaves out."
    />
  </head>
  <body>
    <!-- Before first paint, not in React. The landing page is charcoal for
         everybody; setting it after hydration means a light-mode reader sees
         a white page flash to black, which is the one thing a brand's own
         front page must not do. App.tsx keeps it in sync from here on. -->
    <script>
      if (location.pathname === "/") document.documentElement.setAttribute("data-theme", "dark");
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
